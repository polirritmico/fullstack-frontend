<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>j-kiltro</title>

    <!-- CSS de Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!--Bootstrap Icons  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- CSS externo -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <section>
        <nav class="navbar navbar-expand-md" style="background-color: #c8dfdb">
          <div class="container">
            <a class="navbar-brand" href="#">
              <i class="bi bi-thermometer-low"></i> J-Kiltro
            </a>

            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
              aria-controls="navbarNav"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="#"
                    >Inicio</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Contactanos</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Historia</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Servicios</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Quienes Somos</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </section>

      <section class="seccion-cards py-5">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-xl-4 mb-4">
              <div class="card shadow h-100" style="border-radius: 10%">
                <img
                  src="img/pexels-mikhail-nilov-7469225.jpg"
                  class="card-img-top card-img-top-css"
                  alt="veterinarios atendiendo a un perro"
                />

                <!-- no se centraba boton tuve que usar flexbox-->
                <div class="card-body d-flex flex-column align-items-center">
                  <h2
                    class="card-title texto-fuerte"
                    style="text-align: center"
                  >
                    Veterinaria
                  </h2>
                  <p class="card-text">
                    Veterinaros 24hrs usudasudua brnsduasudsuadu
                  </p>

                  <!-- Botón centrado -->
                  <a href="#" class="btn btn-primary"> entra</a>
                </div>
              </div>
            </div>

            <div class="col-xl-4 mb-4">
              <div class="card shadow h-100" style="border-radius: 10%">
                <img
                  src="img/pexels-1433506698-34667593.jpg"
                  class="card-img-top card-img-top-css"
                  alt="varios gatos comiendo juntos"
                />

                <!-- tambien aca-->
                <div class="card-body d-flex flex-column align-items-center">
                  <h2
                    class="card-title texto-fuerte"
                    style="text-align: center"
                  >
                    Tienda
                  </h2>
                  <p class="card-text">
                    Conoce nuestras tiendas sdasdasdasdasdasd
                  </p>

                  <!-- lo mismo aca -->
                  <a href="#" class="btn btn-primary">entra</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </header>

  
    <main class="pt-5 pb-5" style="background-color: #c8dfdb">
      <div class="container">
        <div class="row">
          <div class="col-12" style="margin-bottom: 2%">
            <figure class="text-center">
              <blockquote class="blockquote text-light">
                <p style="text-align: center; font-size: 22px; font-style: italic;">
                  “Contamos con un equipo de profesionales comprometidos <br />
                  con entregar una atención cercana y de calidad.”
                </p>
              </blockquote>
              <figcaption
                class="blockquote"
                style="background-color:rgb(253, 251, 251); color: rgb(7, 7, 7); font-size: 17px; width: 50%; justify-content: center; margin: 0 auto; padding: 10px;"
              >
                — Dr. Nicolás Herrera, Médico Veterinario.
                <cite title="Source Title"> - Veterinario - </cite>
              </figcaption>
            </figure>
          </div>
        </div>
        <div class="row">
          <div class="col-12" style="margin-bottom: 5%">
            <figure class="text-center">
              <blockquote class="blockquote text-light">
                <p style="text-align: center; font-size: 22px; font-style: italic;">
                  He encontrado productos de muy buena calidad <br />
                  y una atención excelente. La tienda tiene variedad <br />
                  para mis mascotas.”
                </p>
              
              </blockquote>
              <figcaption
                class="blockquote"
                style="background-color:rgb(255, 255, 255); color: rgb(0, 0, 0); font-size: 17px; width: 50%; justify-content: center; margin: 0 auto; padding: 10px;"
                
              >
                — Carolina Martínez, Cliente.
                <cite title="Source Title"> - Cliente - </cite>
              </figcaption>
            </figure>
          </div>
        </div>
      </div>



    <footer class="confi-footer" style="background-color: #F2EFE7">
      <p class="mb-0">© 2026 J-Kiltro — Todos los derechos reservados.</p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
