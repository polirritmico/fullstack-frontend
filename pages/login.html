<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jkiltro | Ingreso</title>
    <link rel="icon" href="../img/logo-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="../favicon.ico" sizes="32x32" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main>
      <div
        class="container min-vh-100 d-flex flex-column justify-content-center"
      >
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
            <div class="card rounded-3 p-4 shadow">
              <div class="text-center mb-4">
                <img
                  src="../img/logo.svg"
                  alt="Logo jKiltro"
                  class="img-fluid max"
                />
              </div>

              <p>Por favor ingrese a su cuenta</p>

              <form action="submit" id="id-login-form">
                <div class="form-floating mb-3">
                  <input
                    type="email"
                    class="form-control"
                    id="id-login-email"
                    placeholder="Correo"
                  />
                  <label for="id-login-email">Dirección de correo</label>
                </div>
                <div class="form-floating mb-3">
                  <input
                    type="password"
                    class="form-control"
                    id="id-login-password"
                    placeholder="Contraseña"
                  />
                  <label for="id-login-password">Contraseña</label>
                </div>

                <div class="d-grid mb-4">
                  <button class="btn btn-primary" type="submit">
                    Ingresar
                  </button>
                </div>
              </form>

              <div class="text-center mb-2">
                <a href="#" class="text-secondary text-decoration-none small"
                  >¿Olvidaste la contraseña?</a
                >
              </div>

              <div class="text-center">
                <p class="text-secondary small mb-0">
                  ¿No tienes cuenta?
                  <a
                    class="text-primary text-decoration-none"
                    href="./perfil/crear-perfil.html"
                  >
                    Regístrate aquí
                  </a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../js/login.js"></script>
  </body>
</html>
