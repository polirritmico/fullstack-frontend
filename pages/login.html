<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jkiltro | Ingreso</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main>
      <div
        class="container min-vh-100 d-flex flex-column justify-content-center"
      >
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8">
            <div class="card rounded-3 p-4">
              <div class="text-center">
                <img
                  src="../img/logo.svg"
                  alt="Logo jKiltro"
                  class="img-fluid"
                />
              </div>

              <p>Por favor ingrese a su cuenta</p>

              <div class="form-floating mb-3">
                <input
                  type="email"
                  class="form-control"
                  id="id-login-mail"
                  placeholder="Correo"
                />
                <label for="id-login-mail">Dirección de correo</label>
              </div>
              <div class="form-floating mb-3">
                <input
                  type="password"
                  class="form-control"
                  id="id-login-password"
                  placeholder="Contraseña"
                />
                <label for="id-login-password">Contraseña</label>
              </div>

              <div class="mb-4">
                <button class="btn btn-primary" type="submit">Ingresar</button>
              </div>

              <div class="mb-4">
                <a href="#">¿Olvidaste la contraseña?</a>
              </div>

              <div class="mb-3">
                <p>¿No tienes cuenta?</p>
                <button type="button" class="btn btn-outline-secondary">
                  Crear nueva cuenta
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
