  <body>
    <header>
      <section>
        <nav class="navbar navbar-expand-md" style="background-color: #c8dfdb">
          <div class="container">
            <a class="navbar-brand" href="../index.html">
              <i class="bi bi-thermometer-low"></i> J-Kiltro

            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
              aria-controls="navbarNav"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                  <a
                    class="nav-link active"
                    aria-current="page"
                    href="../index.html"
                    >Inicio</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Contactanos</a>

      </section>

    <section class="formulario-perfil" style="background-color: #f2f2f2">
      <div class="container">
        <form class="formulario" action="#" method="POST">
          <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required />
          </div>

          <br />

          <div>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required />
          </div>

          <br />

          <div>
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" required />
          </div>

          <br />

          <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required />
          </div>

          <br />

          <button type="submit">Registrar</button>
        </form>
      </div>
    </section>

    <footer class="confi-footer" style="background-color: #f2efe7">
