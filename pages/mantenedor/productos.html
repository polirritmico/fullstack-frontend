<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jK Mantenedor • Productos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/mantenedor.css" />
  </head>

  <body class="d-flex min-vh-100 flex-column">
    <header class="btm-margin bg-white w-100">
      <div class="d-flex align-items-center justify-content-between p-2">
        <div class="d-flex align-items-center gap-3">
          <a class="navbar-brand" href="/index.html">
            <img
              src="../../img/logo-mark.svg"
              alt="Logo jKiltro"
              width="48"
              height="48"
              class="rounded-circle"
            />
          </a>

          <span class="fw-bold fs-4">jKiltro</span>
        </div>

        <div>
          <h1 class="fs-3 fw-semibold text-dark mb-0 jk-font-heading">
            Mantenedor • Productos
          </h1>
        </div>

        <div class="d-flex align-items-center gap-3">
          <div class="text-end">
            <p class="fs-7 fw-semibold mb-0">Alan Brito</p>
            <p class="fs-8 text-body-secondary fw-medium mt-0 mb-0">
              Administrador
            </p>
          </div>
          <div
            class="bg-white rounded-circle shadow d-flex align-items-center justify-content-center avatar-circle"
          >
            <i class="bi bi-person-fill text-info fs-2 lh-1"></i>
          </div>
        </div>
      </div>

      <nav class="navbar border-top py-0">
        <div class="container-fluid">
          <ul class="nav nav-underline align-items-center w-100 gap-2">
            <li class="nav-item">
              <a
                class="nav-link px-3 active"
                data-bs-toggle="tab"
                aria-current="page"
                href="#"
                >Productos
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link px-3"
                data-bs-toggle="tab"
                aria-current="page"
                href="#"
                >Categorías</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link px-3"
                data-bs-toggle="tab"
                aria-current="page"
                href="#"
                >Análisis</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link px-3"
                data-bs-toggle="tab"
                aria-current="page"
                href="#"
                >Configuración</a
              >
            </li>
            <li class="nav-item ms-auto">
              <p class="mb-0 px-3 text-muted" id="id-date">date</p>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="container-fluid d-flex flex-column flex-grow-1 border">
      <div
        class="row flex-grow-1 justify-content-center align-content-start align-content-md-stretch"
      >
        <div
          class="col-12 col-md-4 col-lg-3 col-xl-3 col-xxl-2 bg-white p-0 border-end"
        >
          <div
            class="d-flex py-2 px-3 justify-content-between align-items-center"
            id="id-cat-panel-header"
          >
            <h2 class="text-muted my-0 fs-6">Categorías</h2>
            <button class="btn btn-primary btn-sm">+ Nueva</button>
          </div>

          <div class="border-top d-flex flex-column py-2">
            <div
              class="panel-categorias pt-2 d-md-flex flex-md-column gap-2 gap-md-0"
            >
              <button
                type="button"
                class="btn rounded-0 text-nowrap text-start active"
              >
                <span>🐾</span>
                <span>Todos los productos</span>
              </button>

              <button
                type="button"
                class="btn rounded-0 text-nowrap text-start"
              >
                <span>🐕</span>
                <span>Comida de perro</span>
              </button>

              <button
                type="button"
                class="btn rounded-0 text-nowrap text-start"
              >
                <span>🐈</span>
                <span>Comida de gato</span>
              </button>

              <button
                type="button"
                class="btn rounded-0 text-nowrap text-start"
              >
                <span>🐦</span> Comida de pájaros
              </button>

              <button
                type="button"
                class="btn rounded-0 text-nowrap text-start"
              >
                <span>🐟</span> Comida de Peces
              </button>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-8 col-lg-9 col-xl-9 col-xxl-10">
          <div class="py-2">Detalles tabla</div>
        </div>
      </div>
    </main>

    <footer class="mt-auto bg-body-tertiary jk-footer">
      <p class="px-3 py-1 mb-0 small text-body-secondary text-center">
        @2026 jKiltro. Todos los derecho reservados.
      </p>
    </footer>
  </body>
  <script src="../../js/productos.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</html>
